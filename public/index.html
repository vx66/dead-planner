<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEAD PLANNER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ============ LOGIN ============ -->
  <div id="login-screen" class="screen">
    <div class="ascii-logo">
      <div class="logo-big">DEAD<span class="logo-underscore">_</span>PLANNER</div>
      <div class="logo-sub">planning subsystem / time allocation daemon</div>
    </div>
    <div class="terminal-bar"><span>deadsmile@hack ~$ <span class="terminal-static">auth_required</span><span class="blink">█</span></span></div>
    <div class="login-box panel">
      <div class="panel-title"><span class="cursor-block"></span> AUTHENTICATION_REQUIRED</div>
      <form id="login-form" autocomplete="off">
        <label class="field">&gt; USERNAME</label>
        <input id="login-user" type="text" autocomplete="username" spellcheck="false">
        <label class="field">&gt; PASSWORD</label>
        <input id="login-pass" type="password" autocomplete="current-password">
        <div class="btn-row">
          <button type="submit" class="btn">[ ENTER ]</button>
        </div>
      </form>
      <div id="login-error" class="error-line"></div>
      <button id="register-open" type="button" class="btn">[ CREAR CUENTA ]</button>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="app-screen" class="screen hidden">
    <header class="topbar">
      <div class="brand"><span class="cursor-block"></span>DEAD_PLANNER <span class="dim">v1.0</span></div>
      <nav class="view-nav" id="view-nav">
        <button class="btn btn-nav active" data-view="day">[ DIA ]</button>
        <button class="btn btn-nav" data-view="week">[ SEMANA ]</button>
        <button class="btn btn-nav" data-view="month">[ MES ]</button>
        <button class="btn btn-nav" data-view="year">[ A&Ntilde;O ]</button>
      </nav>
      <div class="date-nav">
        <button id="add-task-btn" class="btn add-btn" title="Nueva tarea">+ TAREA</button>
        <button id="prev-btn" class="btn" title="Anterior">&lt;</button>
        <button id="today-btn" class="btn">HOY</button>
        <button id="next-btn" class="btn" title="Siguiente">&gt;</button>
      </div>
      <div class="userbox">
        <div class="avatar" id="top-avatar"></div>
        <span id="top-username" class="username"></span>
        <button id="profile-btn" class="btn">[ PERFIL ]</button>
        <button id="admin-open" class="btn hidden">[ ADMIN ]</button>
        <button id="logout-btn" class="btn">[ SALIR ]</button>
      </div>
    </header>
    <div class="terminal-bar"><span>deadplanner@hack ~$ <span id="terminal-typed"></span><span class="blink">█</span></span></div>
    <div id="view-title" class="view-title"></div>
    <div id="calendar" class="calendar"></div>
  </div>

  <!-- ============ PROFILE MODAL ============ -->
  <div id="profile-modal" class="modal hidden">
    <div class="panel modal-panel">
      <div class="panel-title"><span class="cursor-block"></span> USER_PROFILE // edit</div>
      <form id="profile-form">
        <div class="avatar big" id="avatar-preview"></div>
        <label class="field">&gt; NOMBRE</label>
        <input id="pf-name" type="text" maxlength="100" spellcheck="false">
        <label class="field">&gt; EMAIL</label>
        <input id="pf-email" type="email" maxlength="200" spellcheck="false">
        <label class="field">&gt; USERNAME</label>
        <input id="pf-username" type="text" maxlength="60" spellcheck="false">
        <label class="field">&gt; AVATAR URL</label>
        <input id="pf-avatar-url" type="url" placeholder="https://...">
        <label class="field">&gt; O SUBIR IMAGEN</label>
        <input id="pf-avatar-file" type="file" accept="image/*">
        <div class="btn-row">
          <button type="submit" class="btn">[ GUARDAR ]</button>
          <button type="button" id="pf-cancel" class="btn">[ CANCELAR ]</button>
        </div>
      </form>
      <div id="pf-msg" class="error-line"></div>
    </div>
  </div>

  <!-- ============ TASK MODAL ============ -->
  <div id="task-modal" class="modal hidden">
    <div class="panel modal-panel">
      <div class="panel-title"><span class="cursor-block"></span> <span id="task-modal-title">NEW_TASK</span></div>
      <form id="task-form">
        <label class="field">&gt; TITULO</label>
        <input id="tk-title" type="text" maxlength="200" spellcheck="false">
        <label class="field">&gt; DESCRIPCION</label>
        <textarea id="tk-desc" rows="3" maxlength="500"></textarea>
        <label class="field">&gt; INICIO</label>
        <input id="tk-start" type="datetime-local">
        <label class="field">&gt; FIN</label>
        <input id="tk-end" type="datetime-local">
        <label class="field">&gt; COLOR</label>
        <div class="color-row" id="tk-colors"></div>
        <label class="field">&gt; TAGS</label>
        <div id="tk-tags" class="color-row" aria-label="Etiquetas de la tarea"></div>
        <label class="field" for="tk-tag-name">&gt; NUEVA ETIQUETA</label>
        <div class="tag-create-row">
          <input id="tk-tag-name" type="text" maxlength="40" placeholder="Nombre del tag" spellcheck="false">
          <input id="tk-tag-color" type="color" value="#00ff41" aria-label="Color de la etiqueta">
          <button id="tk-tag-add" type="button" class="btn">[ AGREGAR ]</button>
        </div>
        <div id="tk-tag-msg" class="error-line" role="status"></div>
        <div class="btn-row">
          <button type="submit" class="btn">[ GUARDAR ]</button>
          <button type="button" id="tk-delete" class="btn danger hidden">[ BORRAR ]</button>
          <button type="button" id="tk-cancel" class="btn">[ CANCELAR ]</button>
        </div>
      </form>
      <div id="tk-msg" class="error-line"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <div id="register-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="register-title">
    <div class="panel modal-panel">
      <div id="register-title" class="panel-title">CREAR CUENTA</div>
      <form id="register-form">
        <label class="field" for="rg-name">&gt; NOMBRE</label>
        <input id="rg-name" type="text" required maxlength="100" autocomplete="name">
        <label class="field" for="rg-email">&gt; EMAIL</label>
        <input id="rg-email" type="email" required maxlength="200" autocomplete="email">
        <label class="field" for="rg-user">&gt; USERNAME</label>
        <input id="rg-user" type="text" required minlength="3" maxlength="60" pattern="[a-zA-Z0-9_.\-]{3,60}" autocomplete="username">
        <label class="field" for="rg-pass">&gt; CONTRASEÑA (mínimo 8 caracteres)</label>
        <input id="rg-pass" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
        <label class="field" for="rg-confirm">&gt; REPETIR CONTRASEÑA</label>
        <input id="rg-confirm" type="password" required minlength="8" maxlength="72" autocomplete="new-password">
        <div class="btn-row">
          <button type="submit" class="btn">[ REGISTRAR ]</button>
          <button id="register-close" type="button" class="btn">[ CANCELAR ]</button>
        </div>
      </form>
      <div id="register-msg" class="error-line" role="status"></div>
    </div>
  </div>

  <div id="admin-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <div class="panel modal-panel admin-panel">
      <div id="admin-title" class="panel-title">ADMIN // USUARIOS</div>
      <div class="btn-row">
        <button id="admin-refresh" type="button" class="btn">[ ACTUALIZAR ]</button>
        <button id="admin-close" type="button" class="btn">[ CERRAR ]</button>
      </div>
      <p id="admin-count" class="field"></p>
      <div id="admin-list" class="admin-list"></div>
      <form id="admin-form" class="hidden">
        <div class="panel-title">EDITAR USUARIO</div>
        <label class="field" for="au-name">&gt; NOMBRE</label>
        <input id="au-name" type="text" maxlength="100">
        <label class="field" for="au-email">&gt; EMAIL</label>
        <input id="au-email" type="email" maxlength="200">
        <label class="field" for="au-user">&gt; USERNAME</label>
        <input id="au-user" type="text" required minlength="3" maxlength="60">
        <label class="field" for="au-password">&gt; NUEVA CONTRASEÑA (vacío = conservar)</label>
        <input id="au-password" type="password" minlength="8" maxlength="72" autocomplete="new-password">
        <label class="field"><input id="au-disabled" type="checkbox"> CUENTA BLOQUEADA</label>
        <div class="btn-row">
          <button type="submit" class="btn">[ GUARDAR ]</button>
          <button id="admin-cancel" type="button" class="btn">[ CANCELAR EDICIÓN ]</button>
        </div>
      </form>
      <div id="admin-msg" class="error-line" role="status"></div>
    </div>
  </div>

  <script src="js/date.js"></script>
  <script src="js/api.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
  <script src="js/accounts.js"></script>
</body>
</html>
